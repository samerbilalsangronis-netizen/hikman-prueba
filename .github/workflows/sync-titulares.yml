name: Sincronizar Titulares

# Reemplaza al botón manual "⟳ Sincronizar (Finnhub)" / "🌐 Traducir
# pendientes" de Titulares.tsx (removidos a pedido del usuario, 31-jul-2026)
# — Vercel Hobby (plan gratis de este proyecto) no permite cron jobs más
# frecuentes que una vez por día, así que la automatización corre acá en
# vez de en Vercel. Cada 10 minutos: trae titulares nuevos de Finnhub y
# traduce los que falten.
#
# Minutos 4/14/24/34/44/54 (no 0/10/20/30/40/50): mismo motivo que
# sync-currencies.yml — evitar la marca exacta de los 10 minutos, la más
# congestionada del scheduler de GitHub Actions (ver ese archivo para el
# detalle completo).
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sincronizar titulares (Finnhub)
        continue-on-error: true
        run: curl -sS --max-time 60 -X POST https://hikman-prueba.vercel.app/api/headlines-sync
      - name: Traducir titulares pendientes
        continue-on-error: true
        run: curl -sS --max-time 60 -X POST https://hikman-prueba.vercel.app/api/translate-headlines
