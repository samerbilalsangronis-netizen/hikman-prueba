name: Sincronizar Divisas

# Reemplaza al botón manual "⟳ Sincronizar con..." de Actualizar.tsx
# (removido a pedido del usuario, 31-jul-2026) — Vercel Hobby (plan gratis
# de este proyecto) no permite cron jobs más frecuentes que una vez por
# día, así que la automatización corre acá en vez de en Vercel. Cada 30
# minutos, todas las divisas — cada paso es independiente
# (continue-on-error) para que si una fuente falla no bloquee al resto.
#
# Minuto 7/37 (no 0/30): GitHub Actions documenta que los workflows
# programados en la marca exacta de hora/media hora compiten con la
# mayor congestión de todo el sistema y son los que más se retrasan —
# confirmado en este repo (auditoría 3-ago-2026: corridas reales cada
# 3-13h en vez de cada 30min pese al cron). Correr en un minuto menos
# común reduce (no elimina) el retraso — GitHub sigue sin garantizar
# la hora exacta, por eso la Rutina de respaldo cada 30 min sigue activa
# como red de seguridad independiente (ver HANDOFF.md).
#
# --max-time 90 en cada curl (6-ago-2026): 2 corridas seguidas quedaron
# "cancelled" después de ~15 min corriendo (visto por el usuario como
# notificación de GitHub) — ningún curl tenía límite de tiempo, así que
# si una fuente externa se cuelga sin responder ni cortar la conexión,
# el paso (y el job entero, sin timeout-minutes tampoco) queda colgado
# indefinidamente en vez de fallar rápido y seguir con el resto (ya
# tienen continue-on-error, pero eso no ayuda si el paso nunca termina).
# Probado en vivo: las 9 fuentes responden entre 2-22s en un día normal,
# 90s da margen de sobra sin dejar que un cuelgue bloquee 15+ minutos.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: USD (FRED)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/fred-sync
      - name: EUR (FRED + Eurostat)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/eur-sync
      - name: GBP (BoE)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/gbp-sync
      - name: CAD (StatCan + BoC)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/cad-sync
      - name: AUD (ABS + RBA)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/aud-sync
      - name: NZD (Stats NZ)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/nzd-sync
      - name: JPY (e-Stat + BOJ)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/jpy-sync
      - name: CHF (SNB + SECO + KOF)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/chf-sync
      - name: CNY (NBS/GACC vía chinadata.live)
        continue-on-error: true
        run: curl -sS --max-time 90 -X POST https://hikman-prueba.vercel.app/api/cny-sync
      # FX spot (H.10) va adentro de USD/fred-sync ahora, no en su propio
      # paso — Vercel Hobby tiene tope de 12 Serverless Functions y ya
      # estábamos en el límite.
